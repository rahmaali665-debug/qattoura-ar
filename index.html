<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قطّورة بالواقع المعزز: التبخر</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="ar-content.js"></script>
  <style>
    /* No background on body: it would be painted over the camera video, which MindAR puts at a negative z-index. */
    html { background: #000; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Tahoma, "Segoe UI", Arial, sans-serif; }
    #start {
      position: fixed; inset: 0; z-index: 30; overflow: hidden; color: #0b4f8a; text-align: center;
      background: linear-gradient(#9fdcff 0%, #6cc2f5 55%, #3a9ee0 100%);
      display: grid; grid-template-rows: 1fr auto auto; grid-template-columns: minmax(0, 1fr); justify-items: center; align-items: end;
      padding: 10px 16px clamp(14px, 2.6vh, 26px); gap: clamp(10px, 1.8vh, 18px);
      /* --bottom: room taken by the steps and the button under Qattoura's feet */
      --bottom: 250px;
      /* --h: height of the Qattoura picture. The tilted sign beside her head adds about 15% more, and her feet reach a little into the steps row. */
      --h: min(calc((100vh - var(--bottom)) / 1.11), 50vw);
    }
    /* calm sea along the bottom; its first wave reaches up to Qattoura's legs */
    .sea {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; overflow: hidden;
      height: calc((var(--bottom) - 22px + var(--h) * .06) / .767);
    }
    .sea svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; }
    .sea .w1 { animation: drift 14s linear infinite; }
    .sea .w2 { animation: drift 10s linear infinite reverse; }
    .sea .w3 { animation: drift 7s linear infinite; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .sea .sway { animation: sway 3.5s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(14px); } }

    .hero {
      position: relative; z-index: 2; direction: ltr; height: calc(var(--h) * 1.15); margin-bottom: calc(var(--h) * -.04);
      /* room on the left for the sign that leans out past her raised hand */
      padding-left: calc(var(--h) * .8); padding-right: calc(var(--h) * .04);
      display: flex; align-items: flex-end;
    }
    /* a little wider than the original drawing, as asked */
    .pic { position: relative; height: var(--h); aspect-ratio: 687 / 574; }
    .pic img { width: 100%; height: 100%; display: block; position: relative; z-index: 2; object-fit: fill; }
    /* the sign leans to the left from her hand; board and stick sit under the picture so her fingers close over the stick */
    .sign { position: absolute; z-index: 1; left: 7.6%; top: 27%; width: 0; height: 0; transform: rotate(-8deg); transform-origin: 0 0; }
    .sign .stick {
      position: absolute; left: calc(var(--h) * -.024); bottom: 0; width: calc(var(--h) * .048);
      height: calc(var(--h) * .07); border-radius: 8px; background: linear-gradient(90deg, #b5773a, #e8b072, #a8692f);
    }
    .sign .board {
      position: absolute; bottom: calc(var(--h) * .03); left: 0; transform: translateX(-85%);
      width: calc(var(--h) * .9); padding: calc(var(--h) * .04) calc(var(--h) * .05);
      background: #fffdf3; color: #0b4f8a; border: calc(var(--h) * .022) solid #f6a623; border-radius: calc(var(--h) * .07);
      box-shadow: 0 8px 0 rgba(0,0,0,.18); font-weight: 900; line-height: 1.22; margin: 0; direction: rtl;
      font-size: calc(var(--h) * .105);
    }
    .sign .board span { display: block; }
    /* the camera in her left hand is a button too, with a blue glow that pulses but does not move */
    .cam-btn {
      position: absolute; z-index: 3; left: 63%; top: 3%; width: 37%; aspect-ratio: 1.15; border-radius: 50%;
      border: 5px solid #3fb5ff; background: rgba(63,181,255,.14); cursor: pointer; padding: 0;
      animation: glowBlue 1.2s ease-in-out infinite;
    }
    @keyframes glowBlue {
      0%, 100% { box-shadow: 0 0 8px 3px rgba(0,140,255,.4), inset 0 0 8px rgba(0,140,255,.3); border-color: #7fcfff; }
      50% { box-shadow: 0 0 44px 18px rgba(0,140,255,.95), inset 0 0 22px rgba(0,140,255,.65); border-color: #0a8cff; }
    }

    .steps {
      position: relative; z-index: 4; list-style: none; margin: 0; padding: 0; width: min(96vw, 1100px);
      display: flex; gap: clamp(8px, 1.6vw, 20px); justify-content: center;
    }
    .steps li {
      flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: clamp(8px, 1vw, 14px); text-align: start;
      background: #ffffff; color: #0b4f8a; border: 4px solid #ffffff; border-radius: 22px;
      padding: clamp(10px, 1.8vh, 18px) clamp(10px, 1.6vw, 20px); font-weight: bold; line-height: 1.35;
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      animation: glowWhite 1.6s ease-in-out infinite;
    }
    /* each step reads as two lines: the action word on top, what to press or where to point below */
    .steps li span { display: flex; flex-direction: column; }
    .steps li em { font-style: normal; font-size: 1.12em; color: #e86a00; }
    .steps li:nth-child(2), .steps li:nth-child(2) b { animation-delay: .53s; }
    .steps li:nth-child(3), .steps li:nth-child(3) b { animation-delay: 1.06s; }
    @keyframes glowWhite {
      0%, 100% { box-shadow: 0 0 4px 1px rgba(255,255,255,.5); border-color: #d9f1ff; }
      50% { box-shadow: 0 0 30px 10px rgba(255,255,255,.98); border-color: #ffffff; }
    }
    /* the numbers glow yellow */
    .steps b {
      flex: none; width: clamp(42px, 5.2vw, 66px); aspect-ratio: 1; border-radius: 50%; color: #0b4f8a;
      background: radial-gradient(circle at 40% 35%, #fff59a, #ffd400 60%, #f5b800); display: grid; place-items: center;
      font-size: clamp(1.4rem, 3vw, 2.1rem); border: 3px solid #fff3a0;
      animation: glowNum 1.6s ease-in-out infinite;
    }
    @keyframes glowNum {
      0%, 100% { box-shadow: 0 0 4px 2px rgba(255,212,0,.5); }
      50% { box-shadow: 0 0 26px 10px rgba(255,212,0,1); }
    }
    #startBtn {
      position: relative; z-index: 4; font: inherit; font-weight: 900; color: #fff;
      font-size: clamp(1.5rem, 3.4vw, 2.3rem); padding: clamp(12px, 2vh, 20px) clamp(40px, 6vw, 80px);
      border: 5px solid #ffe14d; border-radius: 999px; cursor: pointer;
      background: radial-gradient(circle at 50% 30%, #ffc266 0%, #ff8a1f 45%, #e85d00 100%);
      text-shadow: 0 2px 3px rgba(120,40,0,.6);
      animation: glowYellow 1.1s ease-in-out infinite;
    }
    @keyframes glowYellow {
      0%, 100% { box-shadow: 0 0 8px 3px rgba(255,225,0,.55), 0 0 12px 2px rgba(255,236,150,.6) inset; border-color: #ffe14d; }
      50% { box-shadow: 0 0 46px 18px rgba(255,220,0,.95), 0 0 26px 8px rgba(255,240,170,.9) inset; border-color: #fff36b; }
    }
    @media (max-aspect-ratio: 3/4) {
      /* phone held upright: steps stack their number over the text but keep one row */
      /* the sign goes back above her hand so Qattoura can use the full width */
      #start { --bottom: 262px; --h: min(calc((100vh - var(--bottom)) / 1.55), calc((100vw - 32px) / 1.6)); }
      .hero { height: calc(var(--h) * 1.55); padding-left: calc(var(--h) * .35); }
      .sign { transform: rotate(-8deg); }
      .sign .stick { height: calc(var(--h) * .26); }
      .sign .board { bottom: calc(var(--h) * .24); transform: translateX(-36%); }
      .steps { width: 100%; gap: 6px; }
      .steps li { flex-direction: column; gap: 4px; padding: 8px 4px; text-align: center; font-size: clamp(.8rem, 3.6vw, 1.05rem); border-radius: 16px; }
    }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 18px; z-index: 20; text-align: center; pointer-events: none;
    }
    #hint span {
      display: inline-block; background: rgba(11,111,184,.92); color: #fff; font-weight: bold;
      font-size: 1.05rem; padding: 10px 22px; border-radius: 999px;
    }
  </style>
</head>
<body>

<div id="start">
  <div class="sea" aria-hidden="true">
    <svg class="sway" viewBox="0 0 2400 300" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fc6f0"/><stop offset="1" stop-color="#2a8fd0"/></linearGradient>
        <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fa6e6"/><stop offset="1" stop-color="#1572b8"/></linearGradient>
        <linearGradient id="sea3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b86cf"/><stop offset="1" stop-color="#0b4f8a"/></linearGradient>
      </defs>
      <g class="w1">
        <path fill="url(#sea1)" d="M0 70 Q150 30 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70 T2100 70 T2400 70 V300 H0Z"/>
        <path fill="none" stroke="#e9fbff" stroke-width="5" stroke-linecap="round" opacity=".8" d="M0 70 Q150 30 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70 T2100 70 T2400 70"/>
      </g>
      <g class="w2">
        <path fill="url(#sea2)" d="M0 140 Q100 110 200 140 T400 140 T600 140 T800 140 T1000 140 T1200 140 T1400 140 T1600 140 T1800 140 T2000 140 T2200 140 T2400 140 V300 H0Z"/>
        <path fill="none" stroke="#d6f6ff" stroke-width="4" stroke-linecap="round" opacity=".7" d="M0 140 Q100 110 200 140 T400 140 T600 140 T800 140 T1000 140 T1200 140 T1400 140 T1600 140 T1800 140 T2000 140 T2200 140 T2400 140"/>
      </g>
      <g class="w3">
        <path fill="url(#sea3)" d="M0 210 Q75 188 150 210 T300 210 T450 210 T600 210 T750 210 T900 210 T1050 210 T1200 210 T1350 210 T1500 210 T1650 210 T1800 210 T1950 210 T2100 210 T2250 210 T2400 210 V300 H0Z"/>
      </g>
    </svg>
  </div>
  <div class="hero">
    <div class="pic">
      <div class="sign">
        <div class="stick"></div>
        <h1 class="board"><span>اكتشف الرحلة</span><span>مع قطّورة</span></h1>
      </div>
      <img src="qattoura-camera.png" alt="قطّورة تحمل لافتة وكاميرا">
      <button class="cam-btn" id="camBtn" type="button" aria-label="افتح الكاميرا"></button>
    </div>
  </div>
  <ol class="steps">
    <li><b>١</b><span><em>اضغط</em>«افتح الكاميرا»</span></li>
    <li><b>٢</b><span><em>اضغط</em>«سماح»</span></li>
    <li><b>٣</b><span><em>وجّه الكاميرا</em>إلى بطاقة قطّورة</span></li>
  </ol>
  <button id="startBtn" type="button">📷 افتح الكاميرا</button>
</div>
<div id="hint" hidden><span id="hintText">وجّه الكاميرا إلى البطاقة</span></div>

<a-scene id="scene"
         mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.0005; filterBeta: 0.01"
         color-space="sRGB" renderer="colorManagement: true; antialias: true"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets timeout="20000">
    <a-asset-item id="m-sun" src="models/sun.glb"></a-asset-item>
    <a-asset-item id="m-drop" src="models/qattoura.glb"></a-asset-item>
    <a-asset-item id="m-heat" src="models/heat-arrows.glb"></a-asset-item>
    <a-asset-item id="m-up" src="models/up-arrows.glb"></a-asset-item>
    <a-asset-item id="m-wisp" src="models/wisp.glb"></a-asset-item>
    <a-asset-item id="m-cloud" src="models/cloud.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="stage"></a-entity>
  </a-entity>
</a-scene>

<script>
  var scene = document.getElementById('scene');
  var target = document.getElementById('target');
  var hint = document.getElementById('hint');
  var hintText = document.getElementById('hintText');

  var story = null;
  scene.addEventListener('loaded', function () { story = buildQattouraCard(document.getElementById('stage')); });

  document.getElementById('camBtn').addEventListener('click', function () { document.getElementById('startBtn').click(); });
  document.getElementById('startBtn').addEventListener('click', function () {
    document.getElementById('start').style.display = 'none';
    hint.hidden = false;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      hintText.textContent = 'هذا المتصفح لا يفتح الكاميرا. افتح الرابط في Safari أو Chrome.';
      return;
    }
    scene.systems['mindar-image-system'].start();
  });
  scene.addEventListener('arError', function () {
    hintText.textContent = 'تعذّر فتح الكاميرا. اسمح باستخدامها ثم أعد تحميل الصفحة.';
  });
  target.addEventListener('targetFound', function () { hint.hidden = true; if (story) { story.play(); } });
  target.addEventListener('targetLost', function () {
    if (story) { story.reset(); }
    hintText.textContent = 'وجّه الكاميرا إلى البطاقة'; hint.hidden = false;
  });
</script>
</body>
</html>
